[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bilingual-ai-localization-qa"
version = "1.0.0"
description = "A rule-based QA checker for Chinese-to-English AI localization output"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Yu (Ryan) Rong"}]
dependencies = []

[project.scripts]
localization-qa = "localization_qa:main"

[tool.setuptools]
py-modules = ["localization_qa"]
